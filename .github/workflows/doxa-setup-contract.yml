name: Doxa Setup source contracts

on:
  pull_request:
    paths:
      - 'app/packaging/doxa-setup/**'
      - '.github/workflows/doxa-setup-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-contracts:
    name: Doxa installer, AI and bilingual contract checks
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check Worker JavaScript and unit tests (no paid AI)
        shell: pwsh
        run: |
          node --check app/packaging/doxa-setup/assistant/worker.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Worker syntax failed' }
          node --test app/packaging/doxa-setup/assistant/worker.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Worker tests failed' }
      - name: Signed client and optional-AI permission contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\app\packaging\doxa-setup\personal-ui\Test-DoxaGatewayClient.ps1
          if (-not $?) { throw 'AI signing client contract failed' }
          & .\app\packaging\doxa-setup\personal-ui\Test-DoxaCloudAIPolicy.ps1
          if (-not $?) { throw 'Opt-in and enterprise policy contract failed' }
      - name: Branding and English/Romanian single-window checks
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\app\packaging\doxa-setup\personal-ui\Start-DoxaSetup.ps1 -BrandTest
          if (-not $?) { throw 'Branded UI test failed' }
          foreach ($language in @('en','ro')) {
            & .\app\packaging\doxa-setup\personal-ui\Start-DoxaGuidedSetup.ps1 -SeamlessTest -Language $language
            if (-not $?) { throw "One-window test failed for $language" }
          }
      - name: Active consent and Sonnet fixture regression contracts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & .\app\packaging\doxa-setup\full-release\Test-DoxaConsentContract.ps1
          if (-not $?) { throw 'Active first-use consent contract failed' }
          & .\app\packaging\doxa-setup\tests\Test-DoxaSonnetRemediation.ps1 -FixtureOnly
          if (-not $?) { throw 'Driver and AI-policy fixture contract failed' }
      - name: Compile active native Windows host
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $csc=Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          if(-not(Test-Path $csc)){throw 'Windows Framework compiler missing'}
          $output=Join-Path $env:RUNNER_TEMP 'DoxaHostContract.dll'
          $refs=@('/nologo','/target:library','/platform:x64',
            '/reference:System.Windows.Forms.dll','/reference:System.Drawing.dll',
            '/reference:System.Management.dll','/reference:System.Web.Extensions.dll',
            '/reference:System.IO.Compression.dll','/reference:System.IO.Compression.FileSystem.dll')
          & $csc @refs ("/out:$output") .\app\packaging\doxa-setup\full-release\DoxaSetupHost.cs
          if($LASTEXITCODE -ne 0 -or -not(Test-Path $output)){throw 'Native Doxa host compile failed'}
      - name: Build and validate actual embedded application bundle (offline)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root='.\app\packaging\doxa-setup'
          $out=Join-Path $env:RUNNER_TEMP 'doxa-source-contract'
          $bundle=(& "$root\Build-DoxaPersonalBundle.ps1" -OutputDirectory $out -Reproducible | Out-String)|ConvertFrom-Json
          if($bundle.status -ne 'created'){throw 'Application bundle build failed'}
          $validation=(& "$root\Test-DoxaPersonalBundle.ps1" -BundlePath $bundle.path | Out-String)|ConvertFrom-Json
          if($validation.status -ne 'PASS'){throw 'Extracted application bundle validation failed'}
      - name: Explain missing commercial gates
        shell: pwsh
        run: |
          'Source contracts passed. No driver, publisher signing, commercial redistribution, live model inference, Intune or ManageEngine deployment is performed in CI.' | Write-Output
          'Production release still requires a signed release manifest, vendor rights and physical/managed pilot evidence.' | Write-Output